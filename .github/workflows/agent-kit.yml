name: agent-kit

on:
  push:
    branches: [main]
    paths: ["agent-kit/**", ".github/workflows/agent-kit.yml"]
  pull_request:
    paths: ["agent-kit/**", ".github/workflows/agent-kit.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-kit/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Unit tests only: the live and fork suites skip themselves without ADEXTO_LIVE or a local fork.
      - run: npm test
      - run: npm run build
